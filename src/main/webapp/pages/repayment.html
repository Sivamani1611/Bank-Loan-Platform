<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repayment Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; }
        .dashboard-card {
          border-radius: 12px;
          padding: 24px;
          text-align: center;
          color: #34495e;
          font-weight: bold;
          font-size: 1.1rem;
          box-shadow: 0 6px 15px rgba(0,0,0,0.1);
          transition: transform 0.3s ease, box-shadow 0.3s ease;
          background-color: #ffffff;
        }
        .dashboard-card:hover {
          transform: translateY(-5px);
          box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .dashboard-card .icon {
          font-size: 2.5rem;
          color: #3498db;
          margin-bottom: 10px;
        }
        .dashboard-card .title {
          font-size: 0.9rem;
          color: #7f8c8d;
          margin-bottom: 5px;
        }
        .dashboard-card .value {
          font-size: 1.8rem;
          font-weight: 700;
        }
        .dashboard-title {
          font-size: 1.8rem;
          font-weight: 700;
          color: #2c3e50;
          margin-bottom: 30px;
        }
        .btn-primary { background-color: #3498db; border-color: #3498db; }
        .btn-success { background-color: #2ecc71; border-color: #2ecc71; }
        .btn-outline-primary { color: #3498db; border-color: #3498db; }
        .btn-outline-primary:hover { background-color: #3498db; color: white; }
        .card-header {
          background-color: #ecf0f1;
          border-bottom: 1px solid #bdc3c7;
          font-weight: 600;
          color: #34495e;
        }
        .table-striped tbody tr:nth-of-type(odd) {
          background-color: rgba(236, 240, 241, 0.4);
        }
    </style>
</head>
<body>

<div class="container-fluid mt-5">
    <div class="row mb-3">
        <div class="col-12 text-center">
            <h3 class="dashboard-title"><i class="fas fa-chart-line me-2"></i> Repayment Management Dashboard</h3>
        </div>
    </div>

    <div class="row g-4">
        <div class="col">
            <div class="dashboard-card">
                <div class="icon text-primary"><i class="fas fa-dollar-sign"></i></div>
                <div class="title">Total Loan Amount</div>
                <div class="value" id="totalLoanAmount">$0.00</div>
            </div>
        </div>
        <div class="col">
            <div class="dashboard-card">
                <div class="icon text-danger"><i class="fas fa-wallet"></i></div>
                <div class="title">Outstanding Balance</div>
                <div class="value" id="outstandingBalance">$0.00</div>
            </div>
        </div>
        <div class="col">
            <div class="dashboard-card">
                <div class="icon text-success"><i class="fas fa-check-circle"></i></div>
                <div class="title">Total Paid</div>
                <div class="value" id="totalPaid">$0.00</div>
            </div>
        </div>
        <div class="col">
            <div class="dashboard-card">
                <div class="icon text-warning"><i class="fas fa-hourglass-half"></i></div>
                <div class="title">Remaining Installments</div>
                <div class="value" id="remainingInstallments">0</div>
            </div>
        </div>
        <div class="col">
            <div class="dashboard-card" style="background-color: #bdc3c7; color: #2c3e50;">
                <div class="icon" style="color: #34495e;"><i class="fas fa-box"></i></div>
                <div class="title">Loan Product</div>
                <div class="value" id="loanProductName">-</div>
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-6 offset-md-3">
            <label class="form-label" style="font-weight: 600;">Loan Application ID:</label>
            <div class="input-group">
                <input type="number" id="applicationId" class="form-control" placeholder="Enter Loan Application ID">
                <button class="btn btn-primary" id="searchBtn">Search</button>
                <button class="btn btn-success" id="generateBtn">Generate Schedule</button>
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header">Detailed Repayment Schedule</div>
                <div class="card-body table-responsive">
                    <table class="table table-bordered table-hover table-striped">
                        <thead class="bg-light">
                        <tr>
                            <th>Loan Product</th>
                            <th>Due Date</th>
                            <th>Amount Due</th>
                            <th>Payment Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody id="repaymentTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
<script src="/js/repayment.js"></script>
</body>
</html>
